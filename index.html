<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tells the browser the page supports both schemes, so scrollbars, form
         controls and the address bar follow the system setting too. Without it
         only the page changes and the browser chrome stays light. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1017" />

    <meta name="description" content="User management for web applications." />

    <!-- The API is on another origin, so the connection is opened while the bundle is
         still parsing rather than after it. This is the default origin; if
         VITE_API_BASE_URL points somewhere else the hint is simply unused. -->
    <link rel="preconnect" href="https://jsonplaceholder.typicode.com" crossorigin />
    <link rel="dns-prefetch" href="https://jsonplaceholder.typicode.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Users</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
